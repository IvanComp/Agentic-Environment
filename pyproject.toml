[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-quant"
version = "0.3.0"
description = "Architecture experiment framework for peer-preservation tasks and verification patterns."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = ["pyyaml>=6.0", "pandas>=2.0"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7", "notebook>=7.0"]
llm = ["llama-cpp-python>=0.2.90"]
gguf = ["llama-cpp-python>=0.2.90"]

[project.scripts]
agentic-quant = "agentic_quant.run_benchmark:main"
agentic-quant-repeat = "agentic_quant.run_repeated:main"
agentic-quant-ui = "agentic_quant.web_ui:main"
agentic-quant-metrics = "agentic_quant.metrics:main"
agentic-quant-install-cuda = "agentic_quant.install_cuda:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_quant = ["data/potter/*", "data/potter/**/*"]
