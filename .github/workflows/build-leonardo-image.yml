name: Build Leonardo GPU image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - leonardo/Dockerfile
      - .github/workflows/build-leonardo-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: leonardo/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/ivancomp/agentic-environment-leonardo:latest
          labels: org.opencontainers.image.source=https://github.com/IvanComp/Agentic-Environment
          cache-from: type=gha
          cache-to: type=gha,mode=max
